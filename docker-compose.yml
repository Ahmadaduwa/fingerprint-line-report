services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: hip_sqlserver
    restart: always
    user: "0:0"  # เพิ่มบรรทัดนี้เพื่อแก้ปัญหา Access Denied บน Volume
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword676767!
      - MSSQL_PID=Express
    ports:
      - "0.0.0.0:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  line-report:
    build: ./line-report
    container_name: hip_line_report
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - line_report_data:/app/data
    env_file: ./line-report/.env  # ตั้ง LINE token / เวลาส่ง ในไฟล์นี้
    environment:
      - DB_HOST=sqlserver
      - DB_NAME=hiptime

    depends_on:
      - sqlserver

volumes:
  mssql_data:
    external: true
    name: docker_mssql_data  # volume เดิมที่มี DB Synctime
  line_report_data:
